applicability:
  scopes: [api_design, expensive_op_gating, runtime_check]
  do_not_apply_when:
    - 服务 100% 触发, 没"跳过"逻辑 — 直接命名 X() 就够
    - 阈值检查本身就贵 (e.g. 需 DB query) — caller 应自己缓存 last_check_at

