confidence: 0.9  # PG SET 限制广为人知, regex 模板可迁移
applicability:
  scopes: [postgres_rls, sql_injection_defense, tenant_isolation]
  do_not_apply_when:
    - 不用 PG (其他 DB 不一定有此限制)
    - tenant_id 由内部 trusted source 全程生成 (不来自 HTTP)
    - 用 SQLAlchemy ORM 而非 raw SET (但 RLS 仍需要 SET, 无法绕)

