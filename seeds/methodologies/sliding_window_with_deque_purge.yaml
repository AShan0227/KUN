confidence: 0.9  # 2 个独立 service 验证, 模式可清晰扩展
applicability:
  scopes:
    - rate_limiting
    - sliding_window_aggregation
    - per_tenant_quota
    - failure_counter
  do_not_apply_when:
    - 需要"实时" 窗口 (e.g. 严格毫秒级 cutoff) — 用专门 time-series DB
    - 事件量极大 (e.g. 每秒 10k+) — 用 Redis sorted set
    - 窗口要持久化跨进程 — deque 是 in-memory, 用 Redis ZSET 替代

